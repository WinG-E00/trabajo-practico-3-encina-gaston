<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los simpsons</title>

    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- CDN DE BOOSTRAP -->

<body>
    
    <nav class="navbar navbar-expand-lg bg-warning">
        <div class="container-fluid d-flex justify-content-between">
            
            

            <a class="navbar-brand" href="#">Los simpsons</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <form class="d-flex" role="search">
                    <input class="form-control me-2 text-light" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success text-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>


    <main class="container">

            <button class="btn btn-primary" id="buttonVerPersonajes">

            </button>
        </section>


        <section class="bg-danger-subtle                                                                                   ">
            <div class="row" id="#tablaDePersonajes">
                


                -----------------------------------------------------
                <div class="card" style="width: 18rem;">
                    <img src="..." class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Nombre</h5>
                        <p class="card-text">Edad y fecha de nacimiento</p>
                    </div>


                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"></li>
                        <li class="list-group-item">Genero</li>
                        <li class="list-group-item">Ocupacion</li>
                        <li class="list-group-item">Estado</li>

                    </ul>

                    
                </div>






            </div>
        </section>



    </main>
