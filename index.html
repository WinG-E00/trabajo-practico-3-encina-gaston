<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los simpsons</title>

    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- CDN DE BOOSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>
<body>
    
    <nav class="navbar navbar-expand-lg bg-warning">
        <div class="container-fluid d-flex justify-content-between">
            
            

            <a class="navbar-brand" href="#">Los simpsons</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" id="buscador" />
                </form>
            </div>
        </div>
    </nav>


    <main class="container">
        <!-- container con el titulo y el parrafo y el boton -->
        <section class="d-flex container mt-3 justify-content-center flex-column text-center align-items-center">
            <img src="./assets/Images/The_logo_simpsons_yellow.png" class="w-25" alt="">
            <p class="fs-3">Bienvenido a la pagina de los simpsons, Aqui podras encontrar informacion detallada acerca de los personajes principales de los simpsons</p>
        </section>


        <section class="">
            
            
            <div class="row gap-2 mt-5" id="tablaDePersonajes">
                
            </div>
        </section>



    </main>

    <!-- Modal -->
    <div class="modal fade" id="miModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNombre"></h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    
                </div>
            </div>
        </div>
    </div>

    <!-- script js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <!-- Scrip de BOOTSTRAP -->
    <script src="./assets/js/app.js"></script>


</body>
</html>
